# Elastic Beanstalk's Java platform proxies to port 5000 via the PORT variable.
server.port=${PORT:5000}
# In-memory database: free, but data resets on restart. Swap for RDS later if needed.
spring.datasource.url=jdbc:h2:mem:taskflow
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health
